name: Hardhat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Hardhat Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install project dependencies
        run: npm install

      - name: Run Solidity linter
        run: npm run lint

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm run test
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          REPORT_GAS: ${{ secrets.REPORT_GAS }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          INITIAL_SUPPLY: ${{ secrets.INITIAL_SUPPLY }}
          MAX_SUPPLY: ${{ secrets.MAX_SUPPLY }}
          AIRDROP_AMOUNT: ${{ secrets.AIRDROP_AMOUNT }}

      - name: Report Amoy deploy status
        if: always() && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AMOY_DEPLOY == 'true')
        run: |
          echo "Deploy to Amoy skipped - main push and vars.ENABLE_AMOY_DEPLOY=true are required."

      # Amoy へのデプロイはリリース操作であり CI の合否判定には含めない。
      # main への push かつ vars.ENABLE_AMOY_DEPLOY == 'true' のときだけ実行する
      # （既定値 false = デプロイ設定が無い状態では失敗しない）。
      - name: Deploy to Amoy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AMOY_DEPLOY == 'true'
        run: npm run deploy:amoy
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          INITIAL_SUPPLY: ${{ secrets.INITIAL_SUPPLY }}
          MAX_SUPPLY: ${{ secrets.MAX_SUPPLY }}
          AIRDROP_AMOUNT: ${{ secrets.AIRDROP_AMOUNT }}
