name: Hardhat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Hardhat Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install project dependencies
        run: npm install

      - name: Run Solidity linter
        run: npm run lint

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm run test
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          REPORT_GAS: ${{ secrets.REPORT_GAS }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          INITIAL_SUPPLY: ${{ secrets.INITIAL_SUPPLY }}
          MAX_SUPPLY: ${{ secrets.MAX_SUPPLY }}
          AIRDROP_AMOUNT: ${{ secrets.AIRDROP_AMOUNT }}

  # Deployment needs owner-configured secrets (PRIVATE_KEY, AMOY_RPC_URL,
  # INITIAL_OWNER) and a funded Amoy account, so it is a manual operation and
  # must never gate a push or a pull request.
  deploy-amoy:
    name: Deploy to Amoy (manual only)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check deployment configuration
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          INITIAL_OWNER: ${{ secrets.INITIAL_OWNER }}
        run: |
          set -euo pipefail
          for name in PRIVATE_KEY INITIAL_OWNER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret ${name} is not configured on this repository"
              exit 1
            fi
          done

      - name: Deploy to Amoy
        run: npm run deploy:amoy
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          INITIAL_OWNER: ${{ secrets.INITIAL_OWNER }}
          INITIAL_SUPPLY: ${{ secrets.INITIAL_SUPPLY }}
          MAX_SUPPLY: ${{ secrets.MAX_SUPPLY }}
          AIRDROP_AMOUNT: ${{ secrets.AIRDROP_AMOUNT }}
